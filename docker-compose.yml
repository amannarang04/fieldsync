services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldsync
      POSTGRES_PASSWORD: fieldsync_dev
      POSTGRES_DB: fieldsync
    ports: ["5433:5432"]
    volumes: ["fieldsync-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldsync -d fieldsync"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  fieldsync-db:
