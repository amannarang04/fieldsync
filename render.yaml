services:
  - type: web
    name: fieldsync-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build --workspace=shared && npm run db:migrate --workspace=server && npm run build --workspace=server && npm prune --omit=dev --omit=optional
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
